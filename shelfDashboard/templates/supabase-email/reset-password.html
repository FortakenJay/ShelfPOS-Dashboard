<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restablecer contraseña ShelfPOS</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f1f5f9;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:12px;border:1px solid #e2e8f0;">
          <tr>
            <td style="background:#1e293b;padding:24px 32px;text-align:center;">
              <p style="margin:0;font-size:20px;font-weight:700;color:#ffffff;">ShelfPOS</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 16px;font-size:20px;font-weight:700;">Restablecer contraseña</h1>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#475569;">
                Recibimos una solicitud para cambiar la contraseña de su cuenta. Si fue usted, use el enlace siguiente.
              </p>
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:600;color:#ffffff;background:#2563eb;border-radius:8px;text-decoration:none;">
                Elegir nueva contraseña
              </a>
              <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#64748b;">
                Si no solicitó este cambio, ignore este correo.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
